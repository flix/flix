name: HtmlDocumentor

on:
  pull_request:
  merge_group:
  push:
    branches: [ master ]

# Cancel previous runs if the PR is updated
concurrency:
  cancel-in-progress: true
  group: html-documentor-${{ github.ref }}

env:
  # The Nu HTML Checker (the engine behind validator.w3.org/nu), pinned.
  # Published by the validator maintainers as https://www.npmjs.com/package/vnu-jar
  VNU_JAR_VERSION: "26.9.16"

jobs:
  validate-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out master
        uses: actions/checkout@v5
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Mill and Coursier
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.cache/mill
          key: ${{ runner.os }}-mill-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            ${{ runner.os }}-mill-
      - name: Build JAR
        run: ./mill flix.assembly
      - name: Generate the library documentation
        # Runs in an empty directory so that `flix doc` picks up no project files.
        run: |
          mkdir -p out/doc-check
          cd out/doc-check
          java -jar ../flix/assembly.dest/out.jar doc --library
      - name: Check that the documentation was generated
        run: |
          cd out/doc-check/build/doc
          test -f index.html
          test -f styles.css
          test -f index.js
          count=$(ls *.html | wc -l)
          echo "Generated $count HTML pages."
          # The library has several hundred pages; guard against a silently empty run.
          test "$count" -ge 100
      - name: Install the Nu HTML Checker
        run: |
          mkdir -p out/vnu
          cd out/vnu
          npm install --no-save --ignore-scripts --no-audit --no-fund "vnu-jar@${VNU_JAR_VERSION}"
      - name: Validate the HTML and CSS
        # Every page is checked as HTML and styles.css as CSS; warnings count as errors.
        run: >
          java -jar out/vnu/node_modules/vnu-jar/build/dist/vnu.jar
          --skip-non-html --also-check-css --Werror --format gnu
          out/doc-check/build/doc
      - name: Upload the generated documentation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-documentation
          path: out/doc-check/build/doc
